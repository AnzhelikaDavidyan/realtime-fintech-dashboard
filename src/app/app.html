<div class="shell">
  <header class="shell__header">
    <a class="shell__brand" routerLink="/dashboard">
      <span class="shell__logo" aria-hidden="true"></span>
      <span class="shell__brand-name">FinDev Markets</span>
    </a>

    <nav class="shell__nav" aria-label="Main">
      @for (item of navItems; track item.path) {
        <a
          class="shell__link"
          [routerLink]="item.path"
          routerLinkActive="shell__link--active"
          ariaCurrentWhenActive="page"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <app-producer-controls class="shell__actions" />
  </header>

  <main class="shell__content">
    <router-outlet />
  </main>
</div>

<app-toasts />
