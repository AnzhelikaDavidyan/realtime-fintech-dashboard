<p class="actions__note" aria-live="polite">{{ note() }}</p>
<div class="actions__buttons">
  <button type="button" class="button" [disabled]="applying()" (click)="restoreDefaults.emit()">
    Reset to defaults
  </button>
  <!-- aria-disabled instead of disabled: a disabled button gets no hover or
       focus, so its tooltip could never explain why it is unavailable. -->
  <app-tooltip tooltipId="apply-tooltip" [text]="tooltip()">
    <button
      type="submit"
      class="button button--primary"
      [class.button--busy]="applying()"
      [attr.aria-disabled]="!canApply()"
      aria-describedby="apply-tooltip"
    >
      @if (applying()) {
        <span class="spinner" aria-hidden="true"></span>
        Applying…
      } @else {
        Apply
      }
    </button>
  </app-tooltip>
</div>
