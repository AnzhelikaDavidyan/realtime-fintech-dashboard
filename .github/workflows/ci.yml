name: CI

# Runs every check and unit test. Pull requests and branch pushes trigger it
# directly; main runs it through deploy.yml, where it gates the deployment.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

# A newer push to the same PR or branch makes the older run pointless.
# Runs on main (called from deploy.yml) are never cancelled; they queue instead.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - name: Check formatting
        run: cargo fmt --manifest-path wasm/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path wasm/Cargo.toml --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo test --manifest-path wasm/Cargo.toml

  web:
    name: Angular (format, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The TypeScript code imports the generated Wasm package, so build it first.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build Wasm package
        run: npm run build:wasm

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx ng test --watch=false --reporters=default --reporters=junit --output-file=test-results/angular-junit.xml

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: angular-test-report
          path: test-results/
          if-no-files-found: ignore

      - name: Production build
        run: npx ng build
