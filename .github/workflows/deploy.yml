name: CI and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling a deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Same checks and tests as pull requests; nothing is deployed unless they pass.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: wasm-pack

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: wasm

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build Wasm
        run: npm run build:wasm

      - name: Build Angular
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages serves 404.html for unknown paths, so deep links load the SPA.
      - name: Add SPA fallback
        run: cp dist/findev/browser/index.html dist/findev/browser/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/findev/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
